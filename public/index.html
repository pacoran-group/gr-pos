<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Login - Grand Royal POS</title>
<link rel="stylesheet" href="/css/theme.css" />
<script src="/js/theme-boot.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="logo-dot" style="width:44px;height:44px;font-size:17px">GR</div>
      <h2>Grand Royal POS</h2>
      <p class="sub">Masuk untuk melanjutkan</p>
      <div id="expiredMsg" class="error-text" style="display:none">Sesi berakhir, silakan login ulang.</div>
      <label class="field-label">Username</label>
      <input class="field" id="username" autocomplete="username" />
      <label class="field-label">Password</label>
      <input class="field" id="password" type="password" autocomplete="current-password" />
      <div id="loginError" class="error-text" style="display:none"></div>
      <button class="btn btn-primary btn-block" id="btnLogin">Masuk</button>

      <!-- Langkah "Buka Kasir": muncul untuk role kasir yang belum punya shift. -->
      <div id="shiftStep" style="display:none">
        <hr style="border:none;border-top:1px solid var(--border-soft);margin:14px 0" />
        <p class="sub" style="margin:0 0 8px"><b id="shiftHi"></b> — buka kasir untuk memulai shift.</p>
        <label class="field-label">Modal Kasir / kas di laci (Rp)</label>
        <input class="field" id="openingFloat" type="number" min="0" value="0" />
        <div id="shiftErr" class="error-text" style="display:none"></div>
        <button class="btn btn-primary btn-block" id="btnOpenShift">Buka Kasir &amp; Masuk</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('expired')) {
      document.getElementById('expiredMsg').style.display = 'block';
    }

    const ROLE_HOME = { gudang: '/inventory.html', kasir: '/dashboard.html' };
    function go(user) {
      window.location.href = (user && ROLE_HOME[user.role]) || '/dashboard.html';
    }

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      try {
        const result = await Api.login(username, password);
        setSession(result.token, result.user);
        const user = result.user || {};

        // Login = BUKA KASIR. Kasir yang belum punya shift terbuka -> minta
        // modal awal dulu. Kalau sudah punya shift (mis. re-login) -> lanjut.
        if (user.role === 'kasir') {
          let openShift = null;
          try { openShift = (await Api.currentShift()).shift; } catch (e) { /* jangan blok login */ }
          if (!openShift) {
            document.getElementById('shiftHi').textContent = user.full_name || user.username || 'Kasir';
            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('shiftStep').style.display = 'block';
            document.getElementById('openingFloat').focus();
            return;
          }
        }
        go(user);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    });

    document.getElementById('btnOpenShift').addEventListener('click', async () => {
      const btn = document.getElementById('btnOpenShift');
      const errEl = document.getElementById('shiftErr');
      errEl.style.display = 'none';
      btn.disabled = true;
      try {
        await Api.openShift(Number(document.getElementById('openingFloat').value) || 0);
        go(getUser());
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
      }
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnLogin').click();
    });
    document.getElementById('openingFloat').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btnOpenShift').click();
    });
  </script>
</body>
</html>
