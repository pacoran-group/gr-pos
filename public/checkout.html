<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Checkout - Grand Royal POS</title>
<link rel="stylesheet" href="/css/theme.css" />
<script src="/js/theme-boot.js"></script>
</head>
<body>
  <div id="shell"></div>

  <div id="pageContent">
    <a href="#" id="backLink" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:12px;margin-bottom:14px"></a>
    <h2 style="margin:0 0 18px" id="pageTitle">Checkout</h2>

    <div class="checkout-layout">
      <div class="card">
        <h3>Order Summary</h3>
        <div style="overflow-x:auto">
          <table class="summary-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Harga</th><th>Total</th></tr></thead>
            <tbody id="summaryBody"></tbody>
          </table>
        </div>
        <div class="totals-block">
          <div class="totals-row"><span>Subtotal item</span><span id="subtotal">Rp0</span></div>
          <div class="totals-row" id="discRow" style="display:none"><span>Diskon Member</span><span id="discAmt">-Rp0</span></div>
          <div class="totals-row" id="promoRow" style="display:none"><span id="promoLabel">Promo</span><span id="promoAmt">-Rp0</span></div>
          <div class="totals-row" id="exemptRow" style="display:none;font-size:11px;color:var(--text-faint)"><span>Rokok (bebas SC &amp; pajak)</span><span id="exemptAmt">Rp0</span></div>
          <div class="totals-row"><span>Sub Total (DPP)</span><span id="dppAmt">Rp0</span></div>
          <div class="totals-row"><span id="scLabel">Service Charge</span><span id="scAmt">Rp0</span></div>
          <div class="totals-row" id="taxRow" style="display:none"><span id="taxLabel">Pajak Restoran</span><span id="taxAmt">Rp0</span></div>
          <div class="totals-row" id="scInclNote" style="font-size:11px;color:var(--text-faint);display:none"><span>Service charge sudah termasuk dalam harga</span><span></span></div>
          <div class="totals-row grand"><span>Grand Total</span><span id="grandTotalFull">Rp0</span></div>
          <div class="totals-row"><span>Sudah Dibayar (DP)</span><span id="paidAmt">Rp0</span></div>
          <div class="totals-row grand"><span>Sisa Bayar</span><span id="grandTotal">Rp0</span></div>
        </div>
      </div>

      <div class="card">
        <h3>Payment Method</h3>
        <div class="pay-method-grid" id="payMethodGrid">
          <button class="pay-method-btn active" data-m="cash"></button>
          <button class="pay-method-btn" data-m="qris"></button>
          <button class="pay-method-btn" data-m="card"></button>
        </div>

        <div class="amount-box">
          <label>Amount Received</label>
          <div class="row">
            <span class="currency">IDR</span>
            <input id="amountReceived" type="number" min="0" />
          </div>
        </div>
        <div class="change-due"><span>Change Due</span><b id="changeDue">Rp0</b></div>

        <div id="payError" class="error-text" style="display:none"></div>
        <button class="btn btn-primary btn-block" id="btnProcess">Process Payment</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/receipt-print.js"></script>
  <script src="/js/qz-print.js"></script>
  <script>
    renderLayout({ active: 'orders', title: 'Checkout' });
    document.getElementById('backLink').innerHTML = icon('arrowLeft', 14) + ' Kembali';

    // isi ikon tombol metode bayar (dibuat lewat placeholder supaya template literal di atas tetap ringkas)
    document.querySelectorAll('.pay-method-btn')[0].innerHTML = icon('cash', 22) + '<span>Cash</span>';
    document.querySelectorAll('.pay-method-btn')[1].innerHTML = icon('qr', 22) + '<span>QRIS</span>';
    document.querySelectorAll('.pay-method-btn')[2].innerHTML = icon('card', 22) + '<span>Card</span>';

    const transId = new URLSearchParams(location.search).get('id');
    document.getElementById('backLink').href = `/room-detail.html?id=${transId}`;
    let grandTotalValue = 0;
    let selectedMethod = 'cash';
    // Idempotency key untuk percobaan "Process Payment" yang sedang berjalan
    // - dipakai ulang kalau di-retry setelah error jaringan (lihat penjelasan
    // sama di orders.html & diagnosis-sync-issue.md), direset kalau metode
    // bayar diganti (niat berubah).
    let pendingRequestKey = null;
    function requestKeyForSubmit() {
      if (!pendingRequestKey) pendingRequestKey = newRequestKey();
      return pendingRequestKey;
    }

    async function load() {
      // `bill` dihitung server (server/services/bill.js) - klien tidak
      // menghitung ulang, cukup menampilkan.
      const { trans, details, promos_applied, bill } = await Api.getTrans(transId);
      document.getElementById('pageTitle').textContent = `Checkout: Room ${trans.room_id}`;

      document.getElementById('summaryBody').innerHTML = details.map((d) => `
        <tr><td>${d.product_name_snapshot}${Number(d.sc_tax_exempt) ? ' <span style="font-size:10px;color:var(--text-faint)">(bebas SC/pajak)</span>' : ''}</td><td>${d.qty}</td><td class="num">${rupiah(d.price)}</td><td class="num">${rupiah(d.subtotal)}</td></tr>
      `).join('') || '<tr><td colspan="4" style="color:var(--text-faint)">Belum ada item.</td></tr>';

      const b = bill || {};
      const isPP = b.billing_mode === 'plusplus';
      const inclTax = b.price_includes_tax === true; // bayar-per-order
      const memberDisc = Number(b.member_disc_fnb || 0) + Number(b.member_disc_room || 0);
      const promoDisc = Number(b.promo_disc_fnb || 0);

      document.getElementById('subtotal').textContent = rupiah(b.fnb_gross || 0);
      if (memberDisc > 0) {
        document.getElementById('discRow').style.display = 'flex';
        document.getElementById('discAmt').textContent = '-' + rupiah(memberDisc);
      }
      if (promoDisc > 0) {
        const names = (promos_applied || []).map((p) => p.promo_name).join(', ');
        document.getElementById('promoRow').style.display = 'flex';
        document.getElementById('promoLabel').textContent = names ? `Promo (${names})` : 'Promo';
        document.getElementById('promoAmt').textContent = '-' + rupiah(promoDisc);
      }
      if ((isPP || inclTax) && Number(b.exempt_gross)) {
        document.getElementById('exemptRow').style.display = 'flex';
        document.getElementById('exemptAmt').textContent = rupiah(b.exempt_gross);
      }
      document.getElementById('dppAmt').textContent = rupiah(b.fnb_ex_service != null ? b.fnb_ex_service : (b.net_dpp || 0));
      document.getElementById('scLabel').textContent = `Service Charge (${b.service_charge_pct || 0}%${isPP ? '' : ', termasuk'})`;
      document.getElementById('scAmt').textContent = rupiah(b.service_charge || 0);
      if ((isPP || inclTax) && Number(b.resto_tax_pct)) {
        document.getElementById('taxRow').style.display = 'flex';
        document.getElementById('taxLabel').textContent = `Pajak Restoran (${b.resto_tax_pct}%${inclTax ? ', termasuk' : ''})`;
        document.getElementById('taxAmt').textContent = rupiah(b.resto_tax || 0);
      }
      if (!isPP) document.getElementById('scInclNote').style.display = 'flex';

      document.getElementById('grandTotalFull').textContent = rupiah(b.grand_total || 0);
      document.getElementById('paidAmt').textContent = rupiah(b.paid_total != null ? b.paid_total : (b.initial_paid_amount || 0));
      const sisa = b.sisa_bayar || 0;
      grandTotalValue = sisa;
      document.getElementById('grandTotal').textContent = rupiah(sisa);
      document.getElementById('amountReceived').value = sisa;
      updateChange();

      // Harga inklusif: kalau semua order sudah dibayar per-ronde -> checkout
      // = konfirmasi + cetak rekap (tanpa pembayaran). Kalau masih ada tagihan
      // (item "masuk tagihan") -> bayar sekarang, lalu close.
      const payCard = document.querySelectorAll('.card')[1];
      if (inclTax && sisa === 0) {
        document.getElementById('pageTitle').textContent = `Close Room: ${trans.room_id}`;
        if (payCard) {
          payCard.querySelector('.pay-method-grid').style.display = 'none';
          payCard.querySelector('.amount-box').style.display = 'none';
          payCard.querySelector('.change-due').style.display = 'none';
          const h = payCard.querySelector('h3'); if (h) h.textContent = 'Konfirmasi Close Room';
          const note = document.createElement('p');
          note.style.cssText = 'font-size:12.5px;color:var(--green);font-weight:700';
          note.textContent = '✓ Semua order sudah dibayar. Tidak ada pembayaran lagi — tinggal cetak rekap & kosongkan kamar.';
          payCard.insertBefore(note, payCard.querySelector('#payError'));
        }
        document.getElementById('btnProcess').textContent = 'Cetak Rekap & Close Room';
      } else if (inclTax && sisa > 0) {
        if (payCard) {
          const h = payCard.querySelector('h3'); if (h) h.textContent = `Bayar Tagihan (${rupiah(sisa)})`;
          const note = document.createElement('p');
          note.style.cssText = 'font-size:12px;color:var(--text-muted)';
          note.textContent = `Ada ${rupiah(sisa)} item "masuk tagihan" yang belum dibayar. Tagih sekarang lalu close room.`;
          payCard.insertBefore(note, payCard.querySelector('#payError'));
        }
        document.getElementById('btnProcess').textContent = 'Bayar & Close Room';
      }
    }

    document.querySelectorAll('.pay-method-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pay-method-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMethod = btn.dataset.m;
        pendingRequestKey = null; // metode bayar berubah - percobaan submit sebelumnya tidak relevan lagi
      });
    });

    document.getElementById('amountReceived').addEventListener('input', updateChange);
    function updateChange() {
      const received = Number(document.getElementById('amountReceived').value) || 0;
      const change = received - grandTotalValue;
      document.getElementById('changeDue').textContent = rupiah(Math.max(0, change));
    }

    document.getElementById('btnProcess').addEventListener('click', async () => {
      const errEl = document.getElementById('payError');
      errEl.style.display = 'none';
      const btn = document.getElementById('btnProcess');
      btn.disabled = true;
      try {
        const result = await Api.tutupKamar(transId, selectedMethod, requestKeyForSubmit());
        for (const job of result.print_jobs) {
          try {
            await QzPrint.printJob(job); // demo: jatuh ke dialog print browser (lihat FORCE_BROWSER_PRINT di qz-print.js)
            await Api.ackPrint(job.print_log_id);
          } catch (printErr) {
            alert(`Kamar ditutup, tapi cetak tagihan gagal: ${printErr.message}`);
          }
        }
        showToast(
          result.sisa_bayar > 0
            ? `Kamar ditutup. KURANG BAYAR ${rupiah(result.sisa_bayar)}.`
            : `Kamar ditutup — LUNAS. Total ${rupiah(result.grand_total)}.`
        );
        setTimeout(() => (window.location.href = '/dashboard.html'), 900);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
